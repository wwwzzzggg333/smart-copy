<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生成扩展图标</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1b1e;
      color: #e4e5e7;
    }
    h1 { color: #6366f1; margin-bottom: 20px; }
    .icons { display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .icon-item { text-align: center; }
    .icon-item canvas { border: 1px solid #373a40; border-radius: 8px; }
    .icon-item p { margin-top: 8px; font-size: 14px; color: #909296; }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #818cf8; }
    .instructions {
      background: #25262b;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .instructions code {
      background: #2c2e33;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Smart Copy 图标生成器</h1>
  <p>点击下方按钮生成并下载扩展所需的图标文件。</p>
  
  <div class="icons">
    <div class="icon-item">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16x16</p>
    </div>
    <div class="icon-item">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48x48</p>
    </div>
    <div class="icon-item">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128x128</p>
    </div>
  </div>
  
  <button onclick="downloadAll()">下载所有图标</button>
  
  <div class="instructions">
    <strong>使用说明：</strong><br>
    1. 点击"下载所有图标"按钮<br>
    2. 将下载的 <code>icon16.png</code>、<code>icon48.png</code>、<code>icon128.png</code> 文件放入 <code>icons</code> 文件夹<br>
    3. 在 Chrome 中加载扩展即可使用
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const scale = size / 128;
      
      // 背景渐变
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#6366f1');
      gradient.addColorStop(1, '#4f46e5');
      
      // 圆角矩形背景
      const radius = 20 * scale;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // 绘制下载箭头图标
      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = Math.max(2, 8 * scale);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const centerX = size / 2;
      const centerY = size / 2 - 8 * scale;
      const arrowSize = 28 * scale;
      
      // 箭头主体
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - arrowSize);
      ctx.lineTo(centerX, centerY + arrowSize * 0.6);
      ctx.stroke();
      
      // 箭头头部
      ctx.beginPath();
      ctx.moveTo(centerX - arrowSize * 0.5, centerY + arrowSize * 0.1);
      ctx.lineTo(centerX, centerY + arrowSize * 0.6);
      ctx.lineTo(centerX + arrowSize * 0.5, centerY + arrowSize * 0.1);
      ctx.stroke();
      
      // 底部横线
      const lineY = size - 24 * scale;
      ctx.beginPath();
      ctx.moveTo(size * 0.25, lineY);
      ctx.lineTo(size * 0.75, lineY);
      ctx.stroke();
      
      // 复制图标（小方块）
      const boxSize = 16 * scale;
      const boxX = size * 0.7;
      const boxY = size * 0.15;
      ctx.lineWidth = Math.max(1.5, 4 * scale);
      
      ctx.strokeRect(boxX, boxY, boxSize, boxSize);
      ctx.strokeRect(boxX + 6 * scale, boxY + 6 * scale, boxSize, boxSize);
    }
    
    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAll() {
      downloadCanvas(document.getElementById('icon16'), 'icon16.png');
      setTimeout(() => downloadCanvas(document.getElementById('icon48'), 'icon48.png'), 100);
      setTimeout(() => downloadCanvas(document.getElementById('icon128'), 'icon128.png'), 200);
    }
    
    // 初始化绘制
    drawIcon(document.getElementById('icon16'), 16);
    drawIcon(document.getElementById('icon48'), 48);
    drawIcon(document.getElementById('icon128'), 128);
  </script>
</body>
</html>
